<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body class="login-page">
  <form class="login-box" method="post" action="/auth/login">
    <div class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.8 8 10 4.6-1.2 8-5 8-10v-6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      </span>
      Violation Panel
    </div>
    <p class="login-subtitle">Sign in to continue</p>
    <p id="error" class="message error" hidden></p>
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <label>Admin access token
      <textarea name="accessToken" rows="3" autocomplete="off" spellcheck="false" placeholder="Identity access token (admin-client_token)"></textarea>
    </label>
    <small class="login-hint">The reports are for admins only. Leave empty only if the panel has a configured token.</small>
    <button type="submit">Sign in</button>
  </form>
  <script>
    document.body.append(createThemeToggle());
    const messages = {
      invalid: 'Incorrect username or password',
      rate: 'Too many attempts. Try again in a minute',
      token: 'Enter a valid, unexpired admin access token',
      expired: 'Your admin session has ended. Sign in again with a valid access token',
    };
    const error = messages[new URLSearchParams(location.search).get('error')];
    if (error) {
      const el = document.getElementById('error');
      el.textContent = error;
      el.hidden = false;
    }
  </script>
</body>
</html>
