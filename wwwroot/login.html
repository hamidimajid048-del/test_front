<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Sign in — Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body class="login-page">
  <form class="login-box" id="login-form" method="post" action="/auth/login">
    <h1 class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.8 8 10 4.6-1.2 8-5 8-10v-6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      </span>
      Violation Panel
    </h1>
    <p class="login-subtitle">Sign in to continue</p>
    <p id="error" class="message error" role="alert" hidden></p>
    <label>Username <input name="username" autocomplete="username" maxlength="64" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" maxlength="256" required></label>
    <label class="show-password"><input type="checkbox" id="show-password"> Show password</label>
    <div id="access-token" hidden>
      <label>Admin access token
        <textarea name="accessToken" rows="3" autocomplete="off" spellcheck="false" placeholder="Identity access token (admin-client_token)"></textarea>
      </label>
    </div>
    <button type="submit">Continue</button>
  </form>
  <form class="login-box" id="code-form" method="post" action="/auth/verify-code" hidden>
    <h1 class="brand">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4 5.5v6c0 5 3.4 8.8 8 10 4.6-1.2 8-5 8-10v-6z"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>
      </span>
      Violation Panel
    </h1>
    <p class="login-subtitle">Enter the authentication code</p>
    <p id="code-error" class="message error" role="alert" hidden></p>
    <label>Authentication code
      <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="6-digit code" required>
    </label>
    <button type="submit">Sign in</button>
    <a class="secondary-link" href="/login.html">Start again</a>
  </form>
  <script>
    document.body.append(createThemeToggle());
    document.getElementById('show-password').addEventListener('change', event => {
      document.querySelector('#login-form [name="password"]').type = event.target.checked ? 'text' : 'password';
    });
    const messages = {
      invalid: 'Incorrect username or password',
      code: 'Incorrect code',
      restart: 'Sign-in expired. Start again',
      rate: 'Too many attempts',
      token: 'Invalid access token',
      expired: 'Session ended',
    };
    const query = new URLSearchParams(location.search);
    const codeStep = query.get('step') === 'code';
    document.getElementById('login-form').hidden = codeStep;
    document.getElementById('code-form').hidden = !codeStep;
    const error = messages[query.get('error')];
    if (error) {
      const el = document.getElementById(codeStep ? 'code-error' : 'error');
      el.textContent = error;
      el.hidden = false;
    }
    if (codeStep) document.querySelector('#code-form [name="code"]').focus();

    // "none" while the service runs in its temporary panel access mode; any failure shows the token field.
    fetch('/auth/options')
      .then(response => response.ok ? response.json() : Promise.reject())
      .catch(() => ({ accessToken: 'required' }))
      .then(({ accessToken }) => {
        if (accessToken === 'none') return;
        document.getElementById('access-token').hidden = false;
        document.querySelector('[name="accessToken"]').required = accessToken === 'required';
      });
  </script>
</body>
</html>
