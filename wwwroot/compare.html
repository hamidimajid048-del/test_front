<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Compare accounts — Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
  <script src="/i18n.js"></script>
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main class="compare-page">
    <form class="filters cmp-setup" id="filters">
      <h2 class="vs-filter-title" data-icon="filter">Comparison Setup</h2>
      <label class="icon-field">Main login <input name="login" type="text" inputmode="numeric" data-numeric="integer" autocomplete="off" min="1" step="1" required><span class="field-icon" data-icon="user"></span></label>
      <button type="button" class="cmp-swap" id="swap-logins" title="Swap accounts" aria-label="Swap accounts" data-icon="swap"></button>
      <label class="icon-field">Compared login <input name="other" type="text" inputmode="numeric" data-numeric="integer" autocomplete="off" min="1" step="1" required><span class="field-icon" data-icon="user"></span></label>
      <label class="icon-field">Date range
        <select name="range">
          <option value="">All time</option>
          <option value="week">Last week</option>
          <option value="month">Last month</option>
          <option value="3months">Last 3 months</option>
          <option value="6months">Last 6 months</option>
          <option value="year">Last year</option>
          <option value="custom">Custom</option>
        </select>
        <span class="field-icon" data-icon="calendar"></span>
      </label>
      <label class="date-field">From day (UTC) <input name="fromUtc" type="date"><span class="field-icon" data-icon="calendar"></span></label>
      <label class="date-field">To day (UTC) <input name="toUtc" type="date"><span class="field-icon" data-icon="calendar"></span></label>
      <label class="icon-field">Proximity window
        <select name="windowPreset">
          <option value="60">1 minute</option>
          <option value="300" selected>5 minutes</option>
          <option value="900">15 minutes</option>
          <option value="3600">1 hour</option>
          <option value="21600">6 hours</option>
          <option value="86400">24 hours</option>
          <option value="custom">Custom</option>
        </select>
        <span class="field-icon" data-icon="timer"></span>
      </label>
      <label class="icon-field" id="window-custom" hidden>Window (seconds) <input name="windowSeconds" type="text" inputmode="numeric" data-numeric="integer" autocomplete="off" min="1" max="604800" step="1"><span class="field-icon" data-icon="timer"></span></label>
      <label class="icon-field">Proximity match
        <select name="match">
          <option value="Ip">Same IP</option>
          <option value="Subnet">Same network (/24, /64)</option>
          <option value="Asn">Same ASN</option>
        </select>
        <span class="field-icon" data-icon="layers"></span>
      </label>
      <button type="submit" data-icon="search">Compare</button>
    </form>
    <p class="message" id="message"></p>

    <section id="tabs-section" hidden>
      <div class="cmp-accounts" id="accounts"></div>
      <div class="tabs pills" id="tabs"></div>
      <div class="cmp-overview" id="overview-section" hidden>
        <div class="ad-card">
          <h2 class="ad-card-title" data-icon="layers">Overview — Key Findings</h2>
          <div class="signals" id="signals"></div>
          <div id="overview"></div>
        </div>
        <div class="ad-card cmp-findings">
          <h2 class="ad-card-title" data-icon="target">Key Findings</h2>
          <ul id="findings"></ul>
        </div>
      </div>
      <div class="ad-card" id="tab-panel"></div>
    </section>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/related-pages.js"></script>
  <script src="/platform-icons.js"></script>
  <script src="/table-views.js"></script>
  <script src="/range.js"></script>
  <script src="/country-flags.js"></script>
  <script src="/mt5-format.js"></script>
  <script src="/sessions-table.js"></script>
  <script src="/usage-timeline.js"></script>
  <script src="/compare-cards.js"></script>
  <script src="/compare.js"></script>
</body>
</html>
