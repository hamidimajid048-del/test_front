<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Login history — Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main>
    <form class="filters" id="filters">
      <label>Login <input name="login" type="text" inputmode="numeric" data-numeric="integer" autocomplete="off" min="1" step="1" required></label>
      <button type="submit">Search</button>
    </form>
    <p class="message" id="message"></p>

    <div class="summary" id="metadata"></div>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="summary">Summary</button>
      <button type="button" data-tab="details">Details</button>
      <button type="button" data-tab="timeline">Timeline</button>
    </div>

    <section data-panel="summary">
      <div class="summary-columns">
        <div>
          <h3 id="ips-title">IP</h3>
          <div id="ips"></div>
        </div>
        <div>
          <h3 id="cids-title">CID</h3>
          <div id="cids"></div>
        </div>
      </div>
    </section>
    <section data-panel="details" hidden>
      <div id="sessions"></div>
      <div id="sessions-pager"></div>
      <div id="geo-details"></div>
    </section>
    <section data-panel="timeline" hidden>
      <div class="section-head">
        <h3 id="timeline-title">CID usage timeline</h3>
        <div class="toggle" id="timeline-kind">
          <button type="button" data-kind="cid" aria-pressed="true">CID</button>
          <button type="button" data-kind="ip" aria-pressed="false">IP</button>
        </div>
      </div>
      <div id="timeline"></div>
    </section>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/login-lookup.js"></script>
  <script src="/platform-icons.js"></script>
  <script src="/table-views.js"></script>
  <script src="/country-flags.js"></script>
  <script src="/sessions-table.js"></script>
  <script src="/usage-timeline.js"></script>
  <script src="/logins.js"></script>
</body>
</html>
