<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Login history — Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
  <script src="/i18n.js"></script>
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main class="login-history">
    <div class="ad-top lh-top">
      <form class="filters ad-search" id="filters">
        <label><span class="field-name">Login</span> <input name="login" type="text" inputmode="numeric" data-numeric="integer" autocomplete="off" min="1" step="1" required></label>
        <button type="submit" data-icon="search">Search</button>
      </form>
      <div class="related-pages" id="related-pages"></div>
    </div>
    <p class="message" id="message"></p>

    <section class="ad-card lh-info">
      <h3 class="ad-card-title" data-icon="user">Login info</h3>
      <div class="summary lh-meta" id="metadata"></div>
    </section>

    <div class="tabs pills" id="tabs">
      <button type="button" data-tab="summary" data-icon="grid">Summary</button>
      <button type="button" data-tab="details" data-icon="list">Details</button>
      <button type="button" data-tab="timeline" data-icon="history">Timeline</button>
    </div>

    <section data-panel="summary" class="lh-summary">
      <div class="ad-card lh-cids" id="cid-overview"></div>
      <div class="summary-columns">
        <div class="ad-card">
          <h3 class="ad-card-title" data-icon="mapPin"><span id="ips-title">IP</span></h3>
          <div id="ips"></div>
        </div>
        <div class="ad-card">
          <h3 class="ad-card-title" data-icon="monitor"><span id="cids-title">CID</span></h3>
          <div id="cids"></div>
        </div>
      </div>
    </section>
    <section data-panel="details" hidden>
      <div id="sessions"></div>
      <div id="sessions-pager"></div>
      <div id="geo-details"></div>
    </section>
    <section data-panel="timeline" hidden>
      <div class="section-head">
        <h3 id="timeline-title">CID usage timeline</h3>
        <div class="toggle" id="timeline-kind">
          <button type="button" data-kind="cid" aria-pressed="true">CID</button>
          <button type="button" data-kind="ip" aria-pressed="false">IP</button>
        </div>
      </div>
      <div id="timeline"></div>
    </section>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/related-pages.js"></script>
  <script src="/platform-icons.js"></script>
  <script src="/table-views.js"></script>
  <script src="/country-flags.js"></script>
  <script src="/sessions-table.js"></script>
  <script src="/usage-timeline.js"></script>
  <script src="/logins.js"></script>
</body>
</html>
