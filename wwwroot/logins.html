<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Login history — Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main>
    <form class="filters" id="filters">
      <label>Login <input name="login" type="number" min="1" step="1" required></label>
      <button type="submit">Search</button>
    </form>
    <p class="message" id="message"></p>

    <div class="summary" id="metadata"></div>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="summary">Summary</button>
      <button type="button" data-tab="details">Details</button>
    </div>

    <section data-panel="summary">
      <div class="summary-columns">
        <div>
          <h3 id="ips-title">IP</h3>
          <div id="ips"></div>
        </div>
        <div>
          <h3 id="cids-title">CID</h3>
          <div id="cids"></div>
        </div>
      </div>
    </section>
    <section data-panel="details" hidden>
      <div id="sessions"></div>
      <div id="sessions-pager"></div>
      <div id="geo-details"></div>
    </section>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/sessions-table.js"></script>
  <script src="/logins.js"></script>
</body>
</html>
