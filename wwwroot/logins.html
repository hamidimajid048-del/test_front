<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تاریخچهٔ لاگین — پنل تخلفات</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main>
    <form class="filters" id="filters">
      <label>لاگین <input name="login" type="number" min="1" step="1" required class="ltr"></label>
      <button type="submit">نمایش</button>
    </form>
    <p class="message" id="message"></p>

    <div class="tabs" id="tabs">
      <button type="button" data-tab="sessions">جلسات</button>
      <button type="button" data-tab="ips">IP</button>
      <button type="button" data-tab="cids">CID</button>
    </div>

    <section data-panel="sessions">
      <div class="summary" id="metadata"></div>
      <div id="sessions"></div>
      <div id="sessions-pager"></div>
      <div id="geo-details"></div>
    </section>
    <section data-panel="ips" hidden><div id="ips"></div></section>
    <section data-panel="cids" hidden><div id="cids"></div></section>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/logins.js"></script>
</body>
</html>
