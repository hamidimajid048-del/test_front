<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Account — Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main>
    <div class="summary" id="account"></div>
    <p class="message" id="message"></p>

    <section data-permission="account.change-password">
      <div class="section-head"><h2>Change password</h2></div>
      <form class="filters" id="password-form">
        <!-- Lets password managers tie the new password to this account. -->
        <input name="username" autocomplete="username" hidden>
        <label>Current password <input name="currentPassword" type="password" maxlength="256" required autocomplete="current-password"></label>
        <label>New password <input name="newPassword" type="password" minlength="6" maxlength="256" required autocomplete="new-password"></label>
        <label>Repeat new password <input name="confirm" type="password" minlength="6" maxlength="256" required autocomplete="new-password"></label>
        <button type="submit">Change password</button>
      </form>
    </section>

    <section>
      <div class="section-head"><h2>Authenticator</h2></div>
      <p id="two-factor-state"></p>
      <button type="button" id="two-factor-start" hidden>Set up</button>
      <div class="two-factor-setup" id="two-factor-setup" hidden>
        <img id="two-factor-qr" alt="Authenticator QR code">
        <div>
          <code class="secret-key" id="two-factor-key"></code>
          <form class="filters" id="two-factor-form" autocomplete="off">
            <label>Code <input name="code" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" required autocomplete="one-time-code"></label>
            <button type="submit">Enable</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/table-views.js"></script>
  <script src="/account.js"></script>
</body>
</html>
