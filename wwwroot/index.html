<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main>
    <h1 class="page-title">Violation reports</h1>
    <div class="cards" id="cards"></div>
    <span class="status" id="health">Checking service status...</span>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/platform-icons.js"></script>
  <script src="/table-views.js"></script>
  <script>
    renderCards(document.getElementById('cards'));
    renderMenu();
    const health = document.getElementById('health');
    // The panel probes the service itself and answers { available } rather than the usual ResponseBase envelope.
    fetch('/service-status')
      .then(response => response.ok ? response.json() : Promise.reject())
      .then(body => body.available ? Promise.resolve() : Promise.reject())
      .then(() => { health.textContent = 'Violation service is available'; health.classList.add('ok'); })
      .catch(() => { health.textContent = 'Violation service is unavailable'; health.classList.add('down'); });
  </script>
</body>
</html>
