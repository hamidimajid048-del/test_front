<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>کپی‌ترید و هج — پنل تخلفات</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main>
    <form class="filters" id="filters">
      <label>نوع گزارش
        <select name="kind">
          <option value="copy-trade">کپی‌ترید</option>
          <option value="hedge">هج</option>
        </select>
      </label>
      <label>لاگین <input name="login" type="number" min="1" step="1" required class="ltr"></label>
      <label>ثانیه قبل <input name="secondsBefore" type="number" min="0" max="120" step="1" required class="ltr"></label>
      <label>ثانیه بعد <input name="secondsAfter" type="number" min="0" max="120" step="1" required class="ltr"></label>
      <label>حداقل درصد اشتراک <input name="minPercentShare" type="number" min="0" max="100" step="0.01" class="ltr"></label>
      <label>حداقل تعداد اشتراک <input name="minCountShare" type="number" min="1" step="1" class="ltr"></label>
      <label id="volume-tolerance" hidden>درصد تحمل حجم <input name="volumeTolerancePercent" type="number" min="0" max="100" step="0.01" class="ltr"></label>
      <label>مرتب‌سازی
        <select name="sortBy">
          <option value="CountShare">تعداد اشتراک</option>
          <option value="PercentShare">درصد اشتراک</option>
          <option value="ProfitLoss">سود/زیان</option>
          <option value="RelatedLogin">لاگین مرتبط</option>
        </select>
      </label>
      <label>جهت
        <select name="sortDirection">
          <option value="Desc">نزولی</option>
          <option value="Asc">صعودی</option>
        </select>
      </label>
      <button type="submit">نمایش</button>
    </form>
    <p class="message" id="message"></p>

    <section id="list-section" hidden>
      <div class="section-head"><h2 id="list-title"></h2></div>
      <div class="summary" id="list-metadata"></div>
      <div id="list"></div>
      <div id="list-pager"></div>
      <ul class="help">
        <li>تعداد اشتراک: تعداد پوزیشن‌های این لاگین که لاگین مرتبط با آن جفت شده است (هر پوزیشن حداکثر یک جفت).</li>
        <li>درصد اشتراک: تعداد اشتراک تقسیم بر کل پوزیشن‌های این لاگین.</li>
        <li>برای دیدن جفت پوزیشن‌ها روی هر سطر کلیک کنید.</li>
      </ul>
    </section>

    <section id="positions-section" hidden>
      <div class="section-head"><h2 id="positions-title"></h2></div>
      <div class="summary" id="positions-metadata"></div>
      <form class="filters" id="positions-filters">
        <label>مرتب‌سازی
          <select name="sortBy">
            <option value="MainOpenTime">زمان باز شدن اصلی</option>
            <option value="OffsetSeconds">اختلاف زمانی</option>
            <option value="MainProfitLoss">سود/زیان اصلی</option>
            <option value="RelatedProfitLoss">سود/زیان مرتبط</option>
          </select>
        </label>
        <label>جهت
          <select name="sortDirection">
            <option value="Asc">صعودی</option>
            <option value="Desc">نزولی</option>
          </select>
        </label>
        <button type="submit">اعمال</button>
      </form>
      <p class="message" id="positions-message"></p>
      <div id="positions"></div>
      <div id="positions-pager"></div>
    </section>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/copy-trade.js"></script>
</body>
</html>
