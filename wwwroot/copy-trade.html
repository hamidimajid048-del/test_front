<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy trade &amp; hedge — Violation Panel</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/theme.js"></script>
</head>
<body>
  <nav class="menu" id="menu"></nav>
  <main>
    <form class="filters" id="filters">
      <label>Report type
        <select name="kind">
          <option value="copy-trade">Copy trade</option>
          <option value="hedge">Hedge</option>
        </select>
      </label>
      <label>Login <input name="login" type="number" min="1" step="1" required></label>
      <label>Seconds before <input name="secondsBefore" type="number" min="0" max="120" step="1" required></label>
      <label>Seconds after <input name="secondsAfter" type="number" min="0" max="120" step="1" required></label>
      <label>Min share (%) <input name="minPercentShare" type="number" min="0" max="100" step="0.01"></label>
      <label>Min share (count) <input name="minCountShare" type="number" min="1" step="1"></label>
      <label id="volume-tolerance" hidden>Volume tolerance (%) <input name="volumeTolerancePercent" type="number" min="0" max="100" step="0.01"></label>
      <label>Sort by
        <select name="sortBy">
          <option value="CountShare">Share count</option>
          <option value="PercentShare">Share (%)</option>
          <option value="ProfitLoss">Profit/loss</option>
          <option value="RelatedLogin">Related login</option>
        </select>
      </label>
      <label>Direction
        <select name="sortDirection">
          <option value="Desc">Descending</option>
          <option value="Asc">Ascending</option>
        </select>
      </label>
      <button type="submit">Search</button>
    </form>
    <p class="message" id="message"></p>

    <section id="list-section" hidden>
      <div class="section-head"><h2 id="list-title"></h2></div>
      <div class="summary" id="list-metadata"></div>
      <div id="list"></div>
      <div id="list-pager"></div>
      <ul class="help">
        <li><strong>Share count:</strong> the number of this login's positions matched with a position of the related login (each position is matched at most once).</li>
        <li><strong>Share (%):</strong> the share count divided by all positions of this login.</li>
        <li>Click a row to see the matched position pairs.</li>
      </ul>
    </section>

    <section id="positions-section" hidden>
      <div class="section-head"><h2 id="positions-title"></h2></div>
      <div class="summary" id="positions-metadata"></div>
      <form class="filters" id="positions-filters">
        <label>Sort by
          <select name="sortBy">
            <option value="MainOpenTime">Main open time</option>
            <option value="OffsetSeconds">Time offset</option>
            <option value="MainProfitLoss">Main profit/loss</option>
            <option value="RelatedProfitLoss">Related profit/loss</option>
          </select>
        </label>
        <label>Direction
          <select name="sortDirection">
            <option value="Asc">Ascending</option>
            <option value="Desc">Descending</option>
          </select>
        </label>
        <button type="submit">Apply</button>
      </form>
      <p class="message" id="positions-message"></p>
      <div id="positions"></div>
      <div id="positions-pager"></div>
    </section>
  </main>
  <script src="/errors.js"></script>
  <script src="/api.js"></script>
  <script src="/copy-trade.js"></script>
</body>
</html>
